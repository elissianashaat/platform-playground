name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (yaml, workflows, shell)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: yamllint
        run: pipx run yamllint==1.38.0 --strict --format github .

      - name: actionlint
        env:
          # download script pinned to the v1.7.12 commit
          ACTIONLINT_SHA: 914e7df21a07ef503a81201c76d2b11c789d3fca
        run: |
          bash <(curl -sSfL "https://raw.githubusercontent.com/rhysd/actionlint/${ACTIONLINT_SHA}/scripts/download-actionlint.bash") 1.7.12
          ./actionlint -color

      - name: shellcheck
        run: |
          mapfile -t scripts < <(git ls-files '*.sh')
          if [ "${#scripts[@]}" -eq 0 ]; then echo "no shell scripts"; exit 0; fi
          shellcheck --severity=style "${scripts[@]}"

  security:
    name: security (secrets, workflow audit)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # scan every commit in the PR, not just the tip
          persist-credentials: false

      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

      - name: zizmor (GitHub Actions security audit)
        run: pipx run zizmor==1.33.1 --offline --format github .

  ci-ok:
    # The single check branch protection requires; it fails if any job failed or was skipped.
    name: ci-ok
    if: always()
    needs: [lint, security]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: all checks passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do [ "$r" = "success" ] || exit 1; done
